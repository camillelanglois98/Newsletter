<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEON BLOCKS — Tetris</title>
<style>
:root{font-family:system-ui,Arial,sans-serif;color:#e9f4ff;background:#090f21}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at top,#1e3154,#090f21 75%)}.wrap{padding:20px;width:min(100%,760px)}h1{font-size:clamp(28px,6vw,44px);margin:0 0 4px;letter-spacing:3px;color:#66eeff}.sub{color:#a5b6ca;margin-bottom:20px}.game{display:flex;gap:18px;justify-content:center;align-items:flex-start;flex-wrap:wrap}.board{position:relative;border:3px solid #6be8f9;border-radius:10px;box-shadow:0 0 30px #28caff40;overflow:hidden}canvas{display:block;max-width:100%}#board{width:min(300px,85vw);height:auto;background:#0c1428}.side{width:180px;display:grid;gap:12px}.panel{border:1px solid #344f70;border-radius:12px;background:#17253ebd;padding:12px}.label{color:#91a9c3;font-size:12px;letter-spacing:2px;text-transform:uppercase}.value{font-size:27px;font-weight:800;margin:4px 0}.preview{margin:auto;max-width:100%}button{cursor:pointer;background:#173453;color:white;border:1px solid #5c95b2;border-radius:8px;padding:10px;font-weight:700}button:hover{background:#266080}.primary{background:#1a9dba;border-color:#59efff;color:#061321}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}.keys{font-size:12px;color:#adbdce;line-height:1.8}.overlay{position:absolute;inset:0;background:#050b19d9;display:none;align-items:center;justify-content:center;text-align:center;padding:20px}.overlay.show{display:flex}.overlay h2{font-size:25px}.touch{display:flex;justify-content:center;gap:7px;margin-top:16px;flex-wrap:wrap}.touch button{min-width:52px;height:49px;font-size:19px;touch-action:manipulation}@media(min-width:700px){.touch{display:none}}
</style>
</head>
<body><main class="wrap">
<h1>NEON BLOCKS</h1><div class="sub">Tetris — empile les blocs, efface les lignes !</div>
<div class="game"><div class="board"><canvas id="board" width="300" height="600" aria-label="Plateau Tetris"></canvas><div class="overlay show" id="overlay"><div><h2 id="message">Prêt à jouer ?</h2><p id="detail">Utilise les flèches du clavier.</p><button class="primary" id="overlayButton">Jouer</button></div></div></div>
<aside class="side">
<div class="panel"><div class="label">Score</div><div class="value" id="score">0</div><div class="label">Niveau</div><div class="value" id="level">1</div><div class="label">Lignes</div><div class="value" id="lines">0</div></div>
<div class="panel"><div class="label">Prochaine pièce</div><canvas class="preview" id="next" width="120" height="100"></canvas></div>
<div class="panel"><div class="label">Réserve (C)</div><canvas class="preview" id="hold" width="120" height="100"></canvas></div>
<div class="buttons"><button class="primary" id="restart">Rejouer</button><button id="pause">Pause</button></div>
<div class="panel keys">← → déplacer<br>↑ / X tourner<br>↓ accélérer<br>Espace : chute directe<br>C : réserver<br>P : pause</div>
</aside></div>
<div class="touch"><button data-key="ArrowLeft">◀</button><button data-key="ArrowRight">▶</button><button data-key="ArrowUp">⟳</button><button data-key="ArrowDown">▼</button><button data-key="Space">⤓</button><button data-key="KeyC">C</button></div>
</main><script>
(()=>{'use strict';
const W=10,H=20,S=30,canvas=document.getElementById('board'),ctx=canvas.getContext('2d'),nctx=document.getElementById('next').getContext('2d'),hctx=document.getElementById('hold').getContext('2d');
const shapes={I:[[1,1,1,1]],O:[[1,1],[1,1]],T:[[0,1,0],[1,1,1]],S:[[0,1,1],[1,1,0]],Z:[[1,1,0],[0,1,1]],J:[[1,0,0],[1,1,1]],L:[[0,0,1],[1,1,1]]};
const colors={I:'#5deaf4',O:'#ffdc61',T:'#bd83fa',S:'#68e49a',Z:'#ff697f',J:'#6a9fff',L:'#ffad68'};
const $=id=>document.getElementById(id);
let board,piece,next,hold,canHold,bag,score,lines,level,playing,paused,last=0,dropTime=0;
function shuffle(){let a=Object.keys(shapes);for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function drawType(){if(!bag.length)bag=shuffle();return bag.pop()}
function clone(t){return shapes[t].map(r=>r.slice())}
function spawn(){const type=next;next=drawType();piece={type,m:clone(type),x:Math.floor((W-shapes[type][0].length)/2),y:0};preview(nctx,next);if(collides(piece.m,piece.x,piece.y))gameOver()}
function collides(m,x,y){for(let r=0;r<m.length;r++)for(let c=0;c<m[r].length;c++)if(m[r][c]){let xx=x+c,yy=y+r;if(xx<0||xx>=W||yy>=H||(yy>=0&&board[yy][xx]))return true}return false}
function tile(g,x,y,color,size){g.fillStyle=color;g.fillRect(x*size+1,y*size+1,size-2,size-2);g.fillStyle='#ffffff44';g.fillRect(x*size+3,y*size+3,size-6,3)}
function paint(){ctx.clearRect(0,0,300,600);ctx.fillStyle='#0c1428';ctx.fillRect(0,0,300,600);ctx.strokeStyle='#ffffff0c';for(let i=0;i<=W;i++){ctx.beginPath();ctx.moveTo(i*S,0);ctx.lineTo(i*S,H*S);ctx.stroke()}for(let i=0;i<=H;i++){ctx.beginPath();ctx.moveTo(0,i*S);ctx.lineTo(W*S,i*S);ctx.stroke()}board.forEach((row,y)=>row.forEach((t,x)=>{if(t)tile(ctx,x,y,colors[t],S)}));if(piece){let ghost=piece.y;while(!collides(piece.m,piece.x,ghost+1))ghost++;ctx.globalAlpha=.22;drawPiece(piece.m,piece.x,ghost,piece.type);ctx.globalAlpha=1;drawPiece(piece.m,piece.x,piece.y,piece.type)}}
function drawPiece(m,x,y,t){m.forEach((row,r)=>row.forEach((v,c)=>{if(v&&y+r>=0)tile(ctx,x+c,y+r,colors[t],S)}))}
function preview(g,t){g.clearRect(0,0,120,100);if(!t)return;const m=shapes[t],s=23,ox=(120-m[0].length*s)/2,oy=(100-m.length*s)/2;g.save();g.translate(ox,oy);m.forEach((row,r)=>row.forEach((v,c)=>{if(v){g.fillStyle=colors[t];g.fillRect(c*s+1,r*s+1,s-2,s-2);g.fillStyle='#ffffff44';g.fillRect(c*s+3,r*s+3,s-6,3)}}));g.restore()}
function merge(){piece.m.forEach((row,r)=>row.forEach((v,c)=>{if(v&&piece.y+r>=0)board[piece.y+r][piece.x+c]=piece.type}))}
function clearLines(){let count=0;for(let y=H-1;y>=0;y--){if(board[y].every(Boolean)){board.splice(y,1);board.unshift(Array(W).fill(null));count++;y++}}if(count){score+=([0,100,300,500,800][count])*level;lines+=count;level=Math.floor(lines/10)+1;update()}}
function update(){$('score').textContent=score.toLocaleString('fr-FR');$('level').textContent=level;$('lines').textContent=lines}
function lock(){merge();clearLines();canHold=true;spawn()}
function down(manual=false){if(!playing||paused)return;if(!collides(piece.m,piece.x,piece.y+1)){piece.y++;if(manual){score++;update()}}else lock();dropTime=0;paint()}
function move(dir){if(playing&&!paused&&!collides(piece.m,piece.x+dir,piece.y)){piece.x+=dir;paint()}}
function rotate(){if(!playing||paused)return;const m=piece.m[0].map((_,i)=>piece.m.map(row=>row[i]).reverse());for(const dx of [0,-1,1,-2,2])if(!collides(m,piece.x+dx,piece.y)){piece.m=m;piece.x+=dx;paint();return}}
function hardDrop(){if(!playing||paused)return;let n=0;while(!collides(piece.m,piece.x,piece.y+1)){piece.y++;n++}score+=n*2;update();lock();dropTime=0;paint()}
function reserve(){if(!playing||paused||!canHold)return;const t=piece.type;if(hold){piece={type:hold,m:clone(hold),x:Math.floor((W-shapes[hold][0].length)/2),y:0};hold=t;if(collides(piece.m,piece.x,piece.y))gameOver()}else{hold=t;spawn()}canHold=false;preview(hctx,hold);paint()}
function overlay(title,detail,button){$('message').textContent=title;$('detail').textContent=detail;$('overlayButton').textContent=button;$('overlay').classList.add('show')}
function gameOver(){playing=false;overlay('Partie terminée','Score : '+score.toLocaleString('fr-FR'),'Rejouer')}
function start(){board=Array.from({length:H},()=>Array(W).fill(null));score=lines=0;level=1;bag=[];hold=null;canHold=true;next=drawType();piece=null;playing=true;paused=false;last=0;dropTime=0;spawn();preview(hctx,null);update();$('pause').textContent='Pause';$('overlay').classList.remove('show');paint()}
function togglePause(){if(!playing)return;paused=!paused;$('pause').textContent=paused?'Reprendre':'Pause';if(paused)overlay('Pause','Appuie sur P pour reprendre','Reprendre');else{$('overlay').classList.remove('show');last=0}}
function input(key){if(key==='KeyP'){togglePause();return}if(!playing||paused)return;switch(key){case'ArrowLeft':move(-1);break;case'ArrowRight':move(1);break;case'ArrowUp':case'KeyX':rotate();break;case'ArrowDown':down(true);break;case'Space':hardDrop();break;case'KeyC':reserve();break}}
document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault();input(e.code)});
document.querySelectorAll('[data-key]').forEach(b=>b.addEventListener('click',()=>input(b.dataset.key)));
$('restart').onclick=start;$('pause').onclick=togglePause;$('overlayButton').onclick=()=>{if(playing&&paused)togglePause();else start()};
function loop(t){if(!last)last=t;const dt=Math.min(t-last,100);last=t;if(playing&&!paused){dropTime+=dt;if(dropTime>Math.max(90,850*Math.pow(.82,level-1)))down()}requestAnimationFrame(loop)}board=Array.from({length:H},()=>Array(W).fill(null));paint();requestAnimationFrame(loop);
})();
</script></body></html>
